version: '3.8'

services:
  badminton-helper:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    container_name: badminton-helper
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - LINE_CHANNEL_ACCESS_TOKEN=${LINE_CHANNEL_ACCESS_TOKEN}
      - LINE_CHANNEL_SECRET=${LINE_CHANNEL_SECRET}
      - LINE_ADMIN_IDS=${LINE_ADMIN_IDS}
      - GOOGLE_SHEETS_SPREADSHEET_ID=${GOOGLE_SHEETS_SPREADSHEET_ID}
      - GOOGLE_APPLICATION_CREDENTIALS=/home/appuser/credentials/service-account.json
      - SERVER_PORT=8080
      - GIN_MODE=release
      - TZ=Asia/Taipei
    volumes:
      # 掛載 GCP 服務帳號金鑰
      - ../credentials/service-account.json:/home/appuser/credentials/service-account.json:ro
      # 可選：掛載配置檔案以便動態修改
      - ../configs/settings.yaml:/home/appuser/configs/settings.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - badminton-network

networks:
  badminton-network:
    driver: bridge
